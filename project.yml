# XcodeGen spec — run `xcodegen generate` in this folder to create WaktuSolat.xcodeproj
# If you change the bundle ID prefix (com.syaahid), also change AppConfig.appGroupID in Shared/AppConfig.swift.

name: WaktuSolat

options:
  bundleIdPrefix: com.syaahid
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W474JAFSKG   # your Apple Team ID
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:

  # ---------------- iPhone app ----------------
  WaktuSolat:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Waktu Solat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Waktu Solat uses your location to find your JAKIM prayer time zone.
    entitlements:
      path: iOS/WaktuSolat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.syaahid.waktusolat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syaahid.waktusolat
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WaktuSolatWidget
      - target: WaktuSolatWatch
    scheme: {}

  # ---------------- iPhone widgets (Home Screen + Lock Screen) ----------------
  WaktuSolatWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: WidgetShared
      - path: WidgetIOS
    info:
      path: WidgetIOS/Info.plist
      properties:
        CFBundleDisplayName: Waktu Solat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetIOS/WaktuSolatWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.syaahid.waktusolat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syaahid.waktusolat.widget

  # ---------------- Apple Watch app ----------------
  WaktuSolatWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Waktu Solat
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.syaahid.waktusolat
    entitlements:
      path: Watch/WaktuSolatWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.syaahid.waktusolat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syaahid.waktusolat.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WaktuSolatWatchWidget
    scheme: {}

  # ---------------- Apple Watch complications (WidgetKit) ----------------
  WaktuSolatWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: WidgetShared
      - path: WidgetWatch
    info:
      path: WidgetWatch/Info.plist
      properties:
        CFBundleDisplayName: Waktu Solat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetWatch/WaktuSolatWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.syaahid.waktusolat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syaahid.waktusolat.watchkitapp.widget
